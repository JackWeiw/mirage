framework:
  log_level: INFO
  json_logging: false
  agent:
    model: claude-sonnet-5
    max_tokens: 4096
  comparison:
    topdown_threshold_pct: 10.0
    memory_threshold_pct: 5.0
    coverage_threshold_pct: 80.0
    oscillation_window: 3
    no_improvement_stop: 3
    run_failure_stop: 2
    build_failure_stop: 2
    collect_retry: 1
  run_defaults:
    warmup_seconds: 30
    measurement_seconds: 60
    thread_count: 4
    qps: 100
  codegen:
    compile_flags: "-O2 -march=armv8.2-a"
    default_dependencies:
      - name: folly
        version: "2.1.0"
  harness:
    cmake_path: cmake
    make_path: make
    build_dir_suffix: build
  devkit:
    devkit_cmd: null
    duration_seconds: 20
    interval_seconds: 3
    cpu_range: null
    collect_pid: true
