<?xml version="1.0" standalone="no"?>
<svg version="1.1" width="1000" height="120" xmlns="http://www.w3.org/2000/svg">
  <style type="text/css">.func_g:hover { stroke: black; }</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="lightgray"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="120" fill="url(#bg)"/>
  <g>
    <title>Flame Graph</title>
    <rect x="0" y="0" width="1000" height="24" fill="rgb(255,255,255)"/>
    <text x="500" y="16" text-anchor="middle">Flame Graph</text>
  </g>
  <g class="func_g" onmouseover="s(this)" onmouseout="c()" onclick="zoom(this)">
    <title>leafC (300 samples, 30%)</title>
    <rect x="0.0" y="48.0" width="300.0" height="16.0" fill="rgb(230,110,0)"/>
  </g>
  <g class="func_g" onmouseover="s(this)" onmouseout="c()" onclick="zoom(this)">
    <title>Compute::A (500 samples, 50%)</title>
    <rect x="0.0" y="64.0" width="500.0" height="16.0" fill="rgb(0,0,0)"/>
  </g>
  <g class="func_g" onmouseover="s(this)" onmouseout="c()" onclick="zoom(this)">
    <title>Compute::B (400 samples, 40%)</title>
    <rect x="500.0" y="64.0" width="400.0" height="16.0" fill="rgb(0,0,0)"/>
  </g>
  <g class="func_g" onmouseover="s(this)" onmouseout="c()" onclick="zoom(this)">
    <title>Service::run (950 samples, 95%)</title>
    <rect x="0.0" y="80.0" width="950.0" height="16.0" fill="rgb(0,0,0)"/>
  </g>
  <g class="func_g" onmouseover="s(this)" onmouseout="c()" onclick="zoom(this)">
    <title>main (1000 samples, 100%)</title>
    <rect x="0.0" y="96.0" width="1000.0" height="16.0" fill="rgb(0,0,0)"/>
  </g>
</svg>
